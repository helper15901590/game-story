<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">系统架构图</title>
  <desc id="desc">MS51EC0AE 主控通过 SPI 连接 RC522 读取 NTAG216 故事卡，通过 UART 控制 WT2003H4-16S 播放 TF 卡音频，并连接编码器、按键、RGB 灯与电源管理。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3D5A4C"/>
    </marker>
    <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2A9D8F"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FAF7EF"/>

  <text x="64" y="62" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#14261F">系统架构</text>
  <text x="64" y="92" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5B6B62">System architecture · 音频全部存放在本地 TF 卡，设备离线运行</text>

  <!-- Input group -->
  <rect x="56" y="140" width="246" height="440" rx="18" fill="#FFFDF7" stroke="#D8CEBB" stroke-dasharray="6 5"/>
  <text x="74" y="168" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1" fill="#8A7A62">交互输入</text>

  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="72" y="180" width="214" height="82" rx="12" fill="#FFFFFF" stroke="#E0D6C4"/>
    <circle cx="94" cy="208" r="8" fill="#E4572E"/>
    <text x="112" y="213" font-size="17" font-weight="700" fill="#1F3028">旋转编码器</text>
    <text x="112" y="238" font-size="13" fill="#6B7A70">旋转 · 按压 · 长按开关机</text>

    <rect x="72" y="276" width="214" height="82" rx="12" fill="#FFFFFF" stroke="#E0D6C4"/>
    <circle cx="94" cy="304" r="8" fill="#E4572E"/>
    <text x="112" y="309" font-size="17" font-weight="700" fill="#1F3028">插卡触位开关</text>
    <text x="112" y="334" font-size="13" fill="#6B7A70">卡片插入 / 拔出即触发</text>

    <rect x="72" y="372" width="214" height="82" rx="12" fill="#FFFFFF" stroke="#E0D6C4"/>
    <circle cx="94" cy="400" r="8" fill="#E4572E"/>
    <text x="112" y="405" font-size="17" font-weight="700" fill="#1F3028">插播 / 知识按键</text>
    <text x="112" y="430" font-size="13" fill="#6B7A70">短按插播 · 长按跳过</text>

    <rect x="72" y="468" width="214" height="82" rx="12" fill="#FFFFFF" stroke="#E0D6C4"/>
    <circle cx="94" cy="496" r="8" fill="#E4572E"/>
    <text x="112" y="501" font-size="17" font-weight="700" fill="#1F3028">RGB 状态灯</text>
    <text x="112" y="526" font-size="13" fill="#6B7A70">呼吸 · 常亮 · 闪烁提示</text>
  </g>

  <!-- Input bracket -->
  <g stroke="#B9A16B" stroke-width="2" fill="none">
    <path d="M286 221 H330"/>
    <path d="M286 317 H330"/>
    <path d="M286 413 H330"/>
    <path d="M286 509 H330"/>
    <path d="M330 221 V509"/>
  </g>
  <line x1="330" y1="365" x2="364" y2="365" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="545" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8A7A62">GPIO / 外部中断 / PWM</text>

  <!-- MCU -->
  <rect x="370" y="170" width="310" height="360" rx="18" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
  <text x="394" y="212" font-family="'Trebuchet MS','Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#1F2A14">MS51EC0AE</text>
  <text x="394" y="238" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5A4A12">1T 8051 · 24 MHz · 32 KB Flash</text>
  <line x1="394" y1="254" x2="656" y2="254" stroke="#D9A81F" stroke-width="1.5"/>

  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#2B2A16">
    <circle cx="404" cy="286" r="4" fill="#1F2A14"/>
    <text x="420" y="291">读取 NFC 剧情跳转表</text>
    <circle cx="404" cy="322" r="4" fill="#1F2A14"/>
    <text x="420" y="327">维护故事播放状态机</text>
    <circle cx="404" cy="358" r="4" fill="#1F2A14"/>
    <text x="420" y="363">UART 指挥语音芯片</text>
    <circle cx="404" cy="394" r="4" fill="#1F2A14"/>
    <text x="420" y="399">按键、灯效、电量、休眠</text>
    <circle cx="404" cy="430" r="4" fill="#1F2A14"/>
    <text x="420" y="435">内置 2 KB SRAM / 128 B 页</text>
  </g>
  <text x="394" y="500" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B5C1E">无 RTOS · 裸机主循环 + 定时器节拍</text>

  <!-- SPI to RC522 -->
  <line x1="680" y1="220" x2="794" y2="205" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="706" y="202" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#3D5A4C">SPI</text>

  <!-- RC522 -->
  <rect x="800" y="150" width="200" height="110" rx="14" fill="#DDF1E6" stroke="#8FC9AE" stroke-width="2"/>
  <text x="820" y="184" font-family="'Trebuchet MS',sans-serif" font-size="20" font-weight="700" fill="#17452F">RC522</text>
  <text x="820" y="210" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3E6B58">13.56 MHz 读卡模块</text>
  <text x="820" y="234" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5E8573">读卡后断电以省电</text>

  <!-- NTAG card -->
  <g>
    <rect x="1068" y="142" width="84" height="118" rx="10" fill="#FFFFFF" stroke="#8FC9AE" stroke-width="2"/>
    <rect x="1082" y="156" width="38" height="26" rx="4" fill="#F2C94C"/>
    <path d="M1088 162 H1114 M1088 169 H1114 M1088 176 H1104" stroke="#B98900" stroke-width="2"/>
    <text x="1110" y="208" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#17452F">NTAG216</text>
    <text x="1110" y="228" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5E8573">故事卡</text>
  </g>
  <line x1="1000" y1="205" x2="1062" y2="201" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <text x="1004" y="190" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2A9D8F">13.56 MHz</text>

  <!-- UART to WT2003 -->
  <line x1="680" y1="385" x2="794" y2="390" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="374" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#3D5A4C">UART 9600</text>
  <line x1="800" y1="428" x2="686" y2="418" stroke="#3D5A4C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="712" y="444" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#6B7A70">BUSY</text>

  <!-- WT2003 -->
  <rect x="800" y="340" width="200" height="110" rx="14" fill="#DCEBF7" stroke="#94B9D6" stroke-width="2"/>
  <text x="820" y="374" font-family="'Trebuchet MS',sans-serif" font-size="19" font-weight="700" fill="#173B56">WT2003H4-16S</text>
  <text x="820" y="400" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3C6685">UART 语音芯片</text>
  <text x="820" y="424" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5D829E">MP3 / WAV 解码</text>

  <!-- TF card -->
  <g>
    <rect x="1068" y="342" width="84" height="106" rx="10" fill="#FFFFFF" stroke="#94B9D6" stroke-width="2"/>
    <path d="M1090 342 V360 L1084 370 V392 H1136 V342 Z" fill="#EAF2F8"/>
    <text x="1110" y="388" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#173B56">TF 卡</text>
    <text x="1110" y="410" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5D829E">音频库</text>
  </g>
  <line x1="1000" y1="390" x2="1062" y2="390" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1004" y="376" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5D829E">读文件</text>

  <!-- Amp + speaker -->
  <rect x="800" y="520" width="160" height="80" rx="14" fill="#F6E3D3" stroke="#D8A87C" stroke-width="2"/>
  <text x="820" y="552" font-family="'Trebuchet MS',sans-serif" font-size="18" font-weight="700" fill="#6B3A16">WT8302</text>
  <text x="820" y="576" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8A5A33">音频功放</text>
  <line x1="880" y1="450" x2="880" y2="514" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="892" y="490" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#3D5A4C">DAC</text>

  <line x1="960" y1="560" x2="1028" y2="560" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="968" y="546" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8A5A33">模拟音频</text>

  <g>
    <circle cx="1082" cy="560" r="46" fill="#E4572E"/>
    <path d="M1064 546 L1078 546 L1092 532 L1092 588 L1078 574 L1064 574 Z" fill="#FFF6E5"/>
    <path d="M1099 546 A 18 18 0 0 1 1099 574" fill="none" stroke="#FFF6E5" stroke-width="4" stroke-linecap="round"/>
    <text x="1082" y="630" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#6B3A16">4Ω 3W</text>
  </g>

  <!-- Power -->
  <rect x="56" y="630" width="740" height="110" rx="18" fill="#FFFDF7" stroke="#D8CEBB" stroke-dasharray="6 5"/>
  <text x="74" y="656" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1" fill="#8A7A62">电源与充电</text>

  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1F3028" text-anchor="middle">
    <rect x="72" y="672" width="140" height="52" rx="10" fill="#FFFFFF" stroke="#E0D6C4"/>
    <text x="142" y="703">Type-C 5V</text>
    <rect x="230" y="672" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#E0D6C4"/>
    <text x="305" y="697">TP4056</text>
    <text x="305" y="714" font-size="11" fill="#6B7A70">充电管理</text>
    <rect x="398" y="672" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#E0D6C4"/>
    <text x="488" y="697">2000mAh 锂电池</text>
    <text x="488" y="714" font-size="11" fill="#6B7A70">3.7V / 满电 4.2V</text>
    <rect x="596" y="672" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#E0D6C4"/>
    <text x="661" y="697">LDO 3.3V</text>
    <text x="661" y="714" font-size="11" fill="#6B7A70">HL5933</text>
  </g>
  <g stroke="#3D5A4C" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="212" y1="698" x2="224" y2="698"/>
    <line x1="380" y1="698" x2="392" y2="698"/>
    <line x1="578" y1="698" x2="590" y2="698"/>
  </g>
  <path d="M661 672 C661 610 560 610 560 536" fill="none" stroke="#B9A16B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="618" y="612" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#8A7A62">3.3V</text>

  <!-- Legend -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5B6B62">
    <rect x="836" y="676" width="14" height="14" rx="3" fill="#F2C94C"/>
    <text x="858" y="688">主控</text>
    <rect x="906" y="676" width="14" height="14" rx="3" fill="#DDF1E6" stroke="#8FC9AE"/>
    <text x="928" y="688">NFC</text>
    <rect x="976" y="676" width="14" height="14" rx="3" fill="#DCEBF7" stroke="#94B9D6"/>
    <text x="998" y="688">音频</text>
    <rect x="1046" y="676" width="14" height="14" rx="3" fill="#F6E3D3" stroke="#D8A87C"/>
    <text x="1068" y="688">功放 / 电源</text>
  </g>
</svg>
