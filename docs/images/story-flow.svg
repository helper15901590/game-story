<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">故事如何被播放</title>
  <desc id="desc">插入卡片、验证密码、播放验证音效，然后按 NFC 跳转表播放 M 节点；选项进入不同 M，结局节点播放剧终音效后回到待机。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3D5A4C"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#C46A4A"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FAF7EF"/>

  <text x="64" y="62" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#14261F">故事如何被播放</text>
  <text x="64" y="92" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5B6B62">以《小红帽》为例 · 卡里只存跳转表，声音全部来自 TF 卡</text>

  <!-- Top process -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1F3028">
    <rect x="64" y="140" width="170" height="56" rx="28" fill="#DDF1E6" stroke="#8FC9AE" stroke-width="2"/>
    <text x="149" y="174" text-anchor="middle" font-size="16" font-weight="700">插入故事卡</text>

    <rect x="274" y="140" width="190" height="56" rx="28" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="369" y="174" text-anchor="middle" font-size="16" font-weight="700">验证密码 + PACK</text>

    <rect x="504" y="140" width="150" height="56" rx="28" fill="#FFFDF7" stroke="#D8CEBB" stroke-width="2"/>
    <text x="579" y="174" text-anchor="middle" font-size="16" font-weight="700">播放 0005</text>

    <rect x="694" y="140" width="160" height="56" rx="28" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="774" y="174" text-anchor="middle" font-size="16" font-weight="700">自动播放 M1</text>
  </g>
  <g stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)">
    <line x1="234" y1="168" x2="268" y2="168"/>
    <line x1="464" y1="168" x2="498" y2="168"/>
    <line x1="654" y1="168" x2="688" y2="168"/>
  </g>

  <!-- Failure branch -->
  <line x1="369" y1="196" x2="369" y2="214" stroke="#C46A4A" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="294" y="216" width="190" height="42" rx="10" fill="#F6DCD3" stroke="#D99A82"/>
  <text x="389" y="242" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6B2A16">失败 → 0004 + 红灯闪两下</text>

  <!-- M1 -->
  <line x1="774" y1="196" x2="774" y2="236" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="664" y="240" width="220" height="76" rx="14" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="774" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#2B2A16">M1 · 出发前的叮嘱</text>
    <text x="774" y="296" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#5A4A12">0010.mp3</text>
  </g>

  <!-- M1 options -->
  <path d="M674 300 C560 320 490 342 444 366" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="516" y="336" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">O1 · 0011</text>
  <path d="M874 300 C960 320 1012 342 1026 366" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="936" y="336" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">O2 · 0012</text>

  <!-- M3 / M2 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="330" y="368" width="190" height="72" rx="14" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="425" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2A16">M3 · 小路上的遭遇</text>
    <text x="425" y="422" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#5A4A12">0030.mp3</text>

    <rect x="940" y="368" width="190" height="72" rx="14" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="1035" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2A16">M2 · 大路上的帮助</text>
    <text x="1035" y="422" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#5A4A12">0020.mp3</text>
  </g>

  <!-- Linear to M4 -->
  <path d="M425 440 C480 480 566 512 660 532" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="486" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">线性 · 0030</text>
  <path d="M1035 440 C990 480 928 512 888 532" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="952" y="486" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">线性 · 0020</text>

  <!-- M4 -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="664" y="500" width="220" height="76" rx="14" fill="#F2C94C" stroke="#D9A81F" stroke-width="2"/>
    <text x="774" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#2B2A16">M4 · 最后的抉择</text>
    <text x="774" y="556" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#5A4A12">0040.mp3</text>
  </g>

  <!-- M4 options to endings -->
  <path d="M684 560 C560 582 480 602 432 618" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="596" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">O1 · 0041 → E3</text>
  <line x1="774" y1="576" x2="774" y2="614" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="788" y="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">O2 · 0042 → E2</text>
  <path d="M904 560 C1000 582 1052 602 1086 618" fill="none" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="992" y="596" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#3E6B58">O3 · 0043 → E1</text>

  <!-- Endings -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="330" y="620" width="180" height="70" rx="14" fill="#F6DCD3" stroke="#D99A82" stroke-width="2"/>
    <text x="420" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#6B2A16">E3 · 失败结局</text>
    <text x="420" y="673" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#8A4A33">0070.mp3</text>

    <rect x="684" y="620" width="180" height="70" rx="14" fill="#F6DCD3" stroke="#D99A82" stroke-width="2"/>
    <text x="774" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#6B2A16">E2 · 平安结局</text>
    <text x="774" y="673" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#8A4A33">0060.mp3</text>

    <rect x="1000" y="620" width="180" height="70" rx="14" fill="#F6DCD3" stroke="#D99A82" stroke-width="2"/>
    <text x="1090" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#6B2A16">E1 · 胜利结局</text>
    <text x="1090" y="673" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#8A4A33">0050.mp3</text>
  </g>

  <!-- Endings converge -->
  <g fill="none" stroke="#3D5A4C" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M420 690 C420 716 600 726 660 744"/>
    <path d="M774 690 L774 742"/>
    <path d="M1090 690 C1090 716 950 726 890 744"/>
  </g>
  <rect x="624" y="748" width="300" height="46" rx="23" fill="#DDF1E6" stroke="#8FC9AE" stroke-width="2"/>
  <text x="774" y="777" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#17452F">SYSTE/0011 · 剧终音效</text>

  <line x1="774" y1="794" x2="774" y2="822" stroke="#3D5A4C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="654" y="824" width="240" height="42" rx="21" fill="#FFFDF7" stroke="#D8CEBB" stroke-width="2"/>
  <text x="774" y="850" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5B6B62">待机 · 白色呼吸灯</text>

  <!-- Left callout: node page -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="64" y="368" width="230" height="150" rx="14" fill="#FFFDF7" stroke="#D8CEBB"/>
    <text x="84" y="398" font-size="15" font-weight="700" fill="#1F3028">节点页 = 4 字节</text>
    <text x="84" y="426" font-size="13" fill="#5B6B62">① 选项数（00–03）</text>
    <text x="84" y="450" font-size="13" fill="#5B6B62">② O1 / 下一 M</text>
    <text x="84" y="474" font-size="13" fill="#5B6B62">③ O2　　④ O3</text>
    <text x="84" y="500" font-size="12" fill="#C46A4A">四个字节全 00 = 结局</text>
  </g>

  <!-- Left callout: audio naming -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="64" y="548" width="230" height="130" rx="14" fill="#FFFDF7" stroke="#D8CEBB"/>
    <text x="84" y="578" font-size="15" font-weight="700" fill="#1F3028">音频怎么命名</text>
    <text x="84" y="606" font-size="12" fill="#5B6B62">NNN0 主线　NNN1–3 选项</text>
    <text x="84" y="628" font-size="12" fill="#5B6B62">NNNA–C 知识插播</text>
    <text x="84" y="656" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#3E6B58">0041 = M4 的 O1</text>
  </g>

  <!-- Legend -->
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5B6B62">
    <rect x="64" y="716" width="14" height="14" rx="3" fill="#F2C94C" stroke="#D9A81F"/>
    <text x="86" y="728">主线 M</text>
    <rect x="146" y="716" width="14" height="14" rx="3" fill="#F6DCD3" stroke="#D99A82"/>
    <text x="168" y="728">结局 E</text>
    <rect x="228" y="716" width="14" height="14" rx="3" fill="#DDF1E6" stroke="#8FC9AE"/>
    <text x="250" y="728">系统音效</text>
  </g>
</svg>
